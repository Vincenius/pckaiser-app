name: pckaiser
description: "PCKaiser mobile clone — Flutter + Flame client."
publish_to: 'none'
version: 0.2.6+22

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.30.0
  game_core:
    path: ../packages/game_core
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  # Push (ARCHITECTURE.md "FCM") — only active on Android/iOS with the
  # Firebase config files in place (README "Push notifications").
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  # Used by tests to fake the documents directory for SettingsService.
  path_provider_platform_interface: ^2.1.3

# App icons (regenerate with: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#00AA01"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    # Original tile graphics (ORIGINAL_GAME.md §24): 38 indices each.
    # large/ = 32×32 map tiles, small/ = 8×8 minimap/UI tiles.
    - assets/tiles/large/
    - assets/tiles/small/
    # Round app icon shown on the home screen header.
    - assets/icon/icon_small.png
